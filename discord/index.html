<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=https://discord.gg/ZfaQmknXBR">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1e1f22;
            color: #ffffff;
            text-align: center;
        }
        .container {
            padding: 2rem;
            border-radius: 8px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        a {
            color: #5865F2;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #5865F2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h1 id="title-text">Redirecting you to the Discord server...</h1>
        <p id="fallback-text">If you are not redirected automatically, click <a href="https://discord.gg/ZfaQmknXBR">here</a>.</p>
    </div>

    <script>
        const translations = {
            'zh-TW': {
                title: "正在為您導向至 Discord 伺服器...",
                fallbackPrefix: "如果沒有自動跳轉，請點擊 ",
                linkText: "這裡",
                fallbackSuffix: "。"
            },
            'zh-CN': {
                title: "正在为您重定向至 Discord 服务器...",
                fallbackPrefix: "如果没有自动跳转，请点击 ",
                linkText: "这里",
                fallbackSuffix: "。"
            },
            'ja': {
                title: "Discord サーバーにリダイレクトしています...",
                fallbackPrefix: "自動的にリダイレクトされない場合は、",
                linkText: "こちら",
                fallbackSuffix: " をクリックしてください。"
            },
            'ko': {
                title: "Discord 서버로 리디렉션 중입니다...",
                fallbackPrefix: "자동으로 리디렉션되지 않으면 ",
                linkText: "여기",
                fallbackSuffix: "를 클릭하세요."
            },
            'en': {
                title: "Redirecting you to the Discord server...",
                fallbackPrefix: "If you are not redirected automatically, click ",
                linkText: "here",
                fallbackSuffix: "."
            }
        };

        function getLanguage() {
            const lang = navigator.language || navigator.userLanguage;
            if (!lang) return 'en';
            
            const lowerLang = lang.toLowerCase();
            
            if (lowerLang.includes('zh-tw') || lowerLang.includes('zh-hk') || lowerLang.includes('zh-hant')) return 'zh-TW';
            if (lowerLang.includes('zh-cn') || lowerLang.includes('zh-sg') || lowerLang.includes('zh-hans') || lowerLang === 'zh') return 'zh-CN';
            if (lowerLang.startsWith('ja')) return 'ja';
            if (lowerLang.startsWith('ko')) return 'ko';
            
            return 'en';
        }

        // 立即執行語言替換
        const langKey = getLanguage();
        const text = translations[langKey];

        document.getElementById('title-text').textContent = text.title;
        document.title = text.title;
        
        const fallbackNode = document.getElementById('fallback-text');
        fallbackNode.innerHTML = text.fallbackPrefix + '<a href="https://discord.gg/ZfaQmknXBR">' + text.linkText + '</a>' + text.fallbackSuffix;
        
        // 透過 JS 進行跳轉（備用）
        setTimeout(function() {
            window.location.href = "https://discord.gg/ZfaQmknXBR";
        }, 100);
    </script>
</body>
</html>
